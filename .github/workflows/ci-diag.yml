# TEMPORARY — one capture, then deleted: the repo's own "Build and release" step fails while the same
# three APK tasks passed on their own, so run exactly its command and report what it says.
name: CI diagnostics
on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: The release workflow's build step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          set +e
          mkdir -p diag-out
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi
          LOG=diag-out/gradle.log
          ./gradlew :app:assembleFullDebug :app:assembleLiteDebug :app:assembleBeDebug :sdk:build \
              --no-daemon --console=plain --stacktrace > "$LOG" 2>&1
          echo "GRADLE_EXIT=$?" >> "$LOG"
          {
            echo "### RESULT"
            grep -hE "^(BUILD|GRADLE_EXIT|FAILURE)" "$LOG" | head -6
            echo "### FAILING TASKS"
            grep -hE "^> Task .* FAILED" "$LOG" | sort -u | head -20
            echo "### WHAT WENT WRONG"
            grep -hA8 "What went wrong" "$LOG" | grep -vE "^\s*at |^--$" | head -70
            echo "### ERRORS"
            grep -hE "^e: |error:|Could not|Missing class" "$LOG" | sort -u | head -40
            echo "### TAIL"
            tail -40 "$LOG" | cut -c1-240
          } > diag-out/errors.md
          enc() { sed -e 's/%/%25/g' -e 's/#/%23/g' | tr -d '\r' | awk '{printf "%s%s", (NR>1 ? "%0A" : ""), $0}'; }
          split -C 1150 -a 2 -d diag-out/errors.md diag-out/ee
          n=0
          for f in diag-out/ee*; do
            n=$((n+1)); [ "$n" -gt 9 ] && break
            echo "::error title=r$n::$(enc < "$f")"
          done
      - name: Always red
        run: exit 1

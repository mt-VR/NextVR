# TEMPORARY — diagnostics only, delete before merge.
#
# The sandbox this branch is developed in has no JDK and no route to Maven Central or Google's maven,
# so nothing here can be compiled locally. This workflow builds what the real workflows build — the unit
# tests *and* the three APKs, so VINS-Mono's native core is compiled too — and reports the errors back
# through check-run annotations, readable with:
#     gh api repos/mt-VR/NextVR/check-runs/<check-run-id>/annotations --jq '.[].message'
# (the job log, the artifacts and the job summary all live on hosts this environment cannot reach, and
# each annotation is cut at 4096 characters — hence the chunks.)
name: CI diagnostics
on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: Build everything and report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          fi
      - name: Build
        run: |
          set +e
          mkdir -p diag-out
          LOG=diag-out/gradle.log
          # This cycle: the minified release build, which the repo's own workflows never run — R8 has
          # to keep the names libvins_jni.so looks its methods up by.
          ./gradlew :app:assembleFullRelease :app:assembleLiteRelease :app:assembleBeRelease \
              --no-daemon --continue --console=plain --stacktrace --warning-mode=summary \
              > "$LOG" 2>&1
          echo "GRADLE_EXIT=$?" >> "$LOG"
          P=/home/runner/work/NextVR/NextVR/
          {
            echo "### RESULT"
            grep -hE "^(BUILD|GRADLE_EXIT|FAILURE)" "$LOG" | head -6
            echo "### FAILING TASKS"
            grep -hE "^> Task .* FAILED" "$LOG" | sort -u | head -20
            echo "### KOTLIN / JAVA ERRORS"
            grep -hoE "e: file://[^ ]+\.(kt|java):[0-9]+:[0-9]+ .*" "$LOG" | sed "s#file://$P##" | sort -u | head -40
            echo "### R8: MISSING CLASSES AND WARNINGS"
            grep -hE "Missing class|R8:|Warning in |out of which" "$LOG" | sort -u | head -40
            echo "### WHAT WENT WRONG"
            grep -hA5 "What went wrong" "$LOG" | grep -vE "^\s*at |^--$" | head -60
            echo "### THE APK, ITS LIBRARIES"
            for a in app/build/outputs/apk/*/release/*.apk; do
              echo "--- $a ($(stat -c %s "$a" 2>/dev/null) bytes)"
              unzip -l "$a" 2>/dev/null | grep -E "\.so$" | awk '{printf "%s %s\n", $1, $4}' | head -20
            done
            echo "### DID R8 KEEP THE JNI CLASS"
            for m in app/build/outputs/mapping/*/release/mapping.txt; do
              echo "--- $m"
              grep -A3 "com.samrat.vins.VinsCore" "$m" 2>/dev/null | head -20
            done
            echo "### native methods as the dex sees them"
            for a in app/build/outputs/apk/*/release/*.apk; do
              echo "--- $a"
              unzip -p "$a" classes.dex 2>/dev/null | strings | grep -E "nativeStart|nativePushFrame|nativeReadPose|VinsCore" | sort -u | head -12
            done
          } > diag-out/errors.md
          wc -c diag-out/errors.md | cut -c1-40 >> diag-out/errors.md
      - name: What the OpenCV AAR actually contains
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          mkdir -p diag-out
          AAR=$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.opencv" -name "*.aar" 2>/dev/null | head -1)
          {
            echo "### AAR path"
            echo "$AAR"
            echo "### AAR contents (top level, and anything native)"
            unzip -l "$AAR" 2>/dev/null | awk '{print $4}' | grep -vE "^$|^Name$|^---" | \
              grep -iE "prefab|cmake|native|^sdk/|include|[^/]*$|\.so$|\.h$|\.hpp$" | head -80
            echo "### counts"
            unzip -l "$AAR" 2>/dev/null | tail -2
            echo "### prefab in the AAR"
            unzip -l "$AAR" 2>/dev/null | grep -ci prefab || true
            echo "### OpenCVConfig.cmake anywhere in the caches"
            find "$HOME/.gradle/caches" -name "OpenCVConfig.cmake" 2>/dev/null | head -5
            echo "### headers"
            find "$HOME/.gradle/caches" -path "*opencv*" -name "core.hpp" 2>/dev/null | head -5
            echo "### extracted aar dirs"
            find "$HOME/.gradle/caches" -maxdepth 6 -type d -name "opencv*" 2>/dev/null | head -8
            echo "### module metadata"
            find "$HOME/.gradle/caches/modules-2/files-2.1/org.opencv" -name "*.module" 2>/dev/null | head -1 | xargs -r head -c 1500
          } > diag-out/opencv.md
          enc() { sed -e 's/%/%25/g' -e 's/#/%23/g' | tr -d '\r' | awk '{printf "%s%s", (NR>1 ? "%0A" : ""), $0}'; }
          split -C 1150 -a 2 -d diag-out/opencv.md diag-out/ov
          n=0
          for f in diag-out/ov*; do
            n=$((n+1)); [ "$n" -gt 6 ] && break
            echo "::warning title=aar$n::$(enc < "$f")"
          done
      - name: Report
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          # An annotation is cut at 4096 characters, and every newline costs three of those, so the
          # chunks are kept small and on whole lines.
          enc() { sed -e 's/%/%25/g' -e 's/#/%23/g' | tr -d '\r' | awk '{printf "%s%s", (NR>1 ? "%0A" : ""), $0}'; }
          total=$(wc -c < diag-out/errors.md)
          echo "::error title=size::errors.md is $total bytes"
          split -C 1150 -a 2 -d diag-out/errors.md diag-out/ee
          n=0
          for f in diag-out/ee*; do
            n=$((n+1)); [ "$n" -gt 9 ] && break
            echo "::error title=e$n::$(enc < "$f")"
          done
          tail -n +1 diag-out/errors.md | tail -c 6000 > diag-out/tt
          split -C 1150 -a 2 -d diag-out/tt diag-out/ww
          m=0
          for f in diag-out/ww*; do
            m=$((m+1)); [ "$m" -gt 6 ] && break
            echo "::warning title=w$m::$(enc < "$f")"
          done
          echo "::notice title=toolchain::$(enc < diag-out/toolchain.md)"

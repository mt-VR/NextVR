# TEMPORARY — diagnostics only, delete before merge.
#
# The sandbox this branch is developed in has no JDK and no route to Maven Central or Google's
# maven, so nothing here can be compiled locally. This workflow builds everything the real
# workflows build — the unit tests *and* the three APKs, so the native VINS core is compiled too —
# and copies the errors into the job summary, which is readable through the API
# (gh api repos/<owner>/<repo>/actions/jobs/<job-id>/summary) instead of the log download.
name: CI diagnostics
on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: Build everything and report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          fi
      - name: Toolchain and build
        run: |
          S="$GITHUB_STEP_SUMMARY"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          {
            echo "### Toolchain"
            echo '```text'
            java -version 2>&1 || true
            echo "SDK=$SDK"
            for d in platforms ndk ndk-bundle cmake build-tools platform-tools; do
              echo "$d: $(ls "$SDK/$d" 2>/dev/null | tr '\n' ' ' || true)"
            done
            echo "cmake: $(command -v cmake || echo none) | $(cmake --version 2>&1 | head -1 || true)"
            echo "ninja: $(command -v ninja || echo none)"
            echo "clang: $(clang --version 2>&1 | head -1 || true)"
            echo '```'
          } >> "$S"
          mkdir -p diag-out
          LOG=diag-out/gradle.log
          set +e
          ./gradlew test :app:assembleFullDebug :app:assembleLiteDebug :app:assembleBeDebug \
              --no-daemon --continue --console=plain --stacktrace --warning-mode=summary \
              > "$LOG" 2>&1
          echo "GRADLE_EXIT=$?" | tee -a "$LOG"
          set -e
          {
            echo "### gradle output (first 400 lines)"
            echo '```text'
            cut -c1-260 "$LOG" | head -400
            echo '```'
          } >> "$S"
          {
            echo "### compile errors (Kotlin/Java)"
            echo '```text'
            grep -nE "^(e: |w: file|> Task .*(FAILED|compile))" "$LOG" | head -60 || true
            grep -nE "[A-Za-z0-9_./-]+\.(kt|kts|java):[0-9]+:[0-9]+" "$LOG" | head -140 || true
            echo '```'
            echo "### what went wrong"
            echo '```text'
            awk '/\* What went wrong/{p=1} /\* Try:/{p=0} p' "$LOG" | cut -c1-300 | head -200 || true
            echo '```'
            echo "### native + resolution errors"
            echo '```text'
            grep -nE "error:|fatal error|undefined reference|CMake Error|Could not (resolve|find|create|download|open)|Unresolved reference|FAILURE: Build" "$LOG" | cut -c1-300 | head -200 || true
            echo '```'
            echo "### tasks that failed"
            echo '```text'
            grep -nE "^> Task .* FAILED" "$LOG" | head -40 || true
            echo '```'
            echo "### tail"
            echo '```text'
            cut -c1-260 "$LOG" | tail -60
            echo '```'
          } >> "$S"
          exit 1
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-logs
          path: diag-out/gradle.log
          if-no-files-found: ignore

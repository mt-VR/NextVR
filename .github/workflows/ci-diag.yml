# TEMPORARY — diagnostics only, delete before merge.
#
# The sandbox this branch is developed in has no JDK and no route to Maven Central or Google's maven,
# so nothing here can be compiled locally. This workflow builds what the real workflows build — the unit
# tests *and* the three APKs, so VINS-Mono's native core is compiled too — and reports the errors back
# through check-run annotations, which are readable with
#     gh api repos/mt-VR/NextVR/check-runs/<check-run-id>/annotations
# (the job log, the artifacts and the job summary all live on hosts this environment cannot reach).
name: CI diagnostics
on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  diag:
    name: Build everything and report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          fi
      - name: Toolchain and build
        run: |
          set +e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p diag-out
          LOG=diag-out/gradle.log
          {
            echo "TOOLCHAIN"
            java -version 2>&1 || true
            echo "SDK=$SDK"
            for d in platforms ndk ndk-bundle cmake build-tools; do
              echo "$d: $(ls "$SDK/$d" 2>/dev/null | tr '\n' ' ' || true)"
            done
            echo "cmake: $(command -v cmake || echo none) | $(cmake --version 2>&1 | head -1 || true)"
            echo "ninja: $(command -v ninja || echo none)"
          } > diag-out/toolchain.md
          ./gradlew test :app:assembleFullDebug :app:assembleLiteDebug :app:assembleBeDebug \
              --no-daemon --continue --console=plain --stacktrace --warning-mode=summary \
              > "$LOG" 2>&1
          echo "GRADLE_EXIT=$?" >> "$LOG"
          grep -nE "^(e: |w: file)" "$LOG" | head -100 > diag-out/errors.md
          grep -nE "[A-Za-z0-9_./-]+\.(kt|kts|java|cpp|c|h):[0-9]+:[0-9]+" "$LOG" | head -200 >> diag-out/errors.md
          awk '/\* What went wrong/{p=1} /\* Try:/{p=0} p' "$LOG" | head -300 >> diag-out/errors.md
          grep -nE "error:|fatal error|undefined reference|CMake Error|Could not (resolve|find|create|download|open)|FAILURE: Build|> Task .* FAILED" "$LOG" \
              | cut -c1-300 | head -300 >> diag-out/errors.md
          echo "=== TAIL ===" >> diag-out/errors.md
          tail -100 "$LOG" >> diag-out/errors.md
          wc -l "$LOG" diag-out/errors.md >> diag-out/errors.md
      - name: Report as annotations
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          encode() { sed -e 's/%/%25/g' -e 's/#/%23/g' | tr -d '\r' | awk '{printf "%s%s", (NR>1 ? "%0A" : ""), $0}'; }
          head -c 45000 diag-out/errors.md | encode > diag-out/a1.txt
          tail -c 20000 diag-out/gradle.log | encode > diag-out/a2.txt
          { cat diag-out/toolchain.md; echo; head -c 6000 diag-out/gradle.log; } | encode > diag-out/a0.txt
          echo "::error title=report::$(cat diag-out/a1.txt)"
          echo "::error title=gradle tail::$(cat diag-out/a2.txt)"
          echo "::notice title=toolchain and head::$(cat diag-out/a0.txt)"
          wc -c diag-out/errors.md diag-out/a1.txt
      - name: Push the log to ci-diag
        run: |
          set +e
          cd "$RUNNER_TEMP"
          rm -rf push; mkdir push; cd push
          cp "$GITHUB_WORKSPACE"/diag-out/*.md "$GITHUB_WORKSPACE"/diag-out/gradle.log . 2>/dev/null
          ls -la
          git init -q .
          git config user.name ci-diag
          git config user.email ci-diag@localhost
          git add -A
          git commit -qm "diag log $GITHUB_RUN_ID"
          echo "COMMIT_EXIT=$?"
          git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              HEAD:refs/heads/ci-diag --force
          echo "PUSH_EXIT=$?"
      - name: Fail, so the run is marked red
        run: exit 1

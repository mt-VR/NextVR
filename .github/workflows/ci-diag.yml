# TEMPORARY — diagnostics only, delete before merge.
#
# The sandbox this branch is developed in has no JDK and no route to Maven Central or Google's maven,
# so nothing here can be compiled locally. This workflow builds what the real workflows build — the unit
# tests *and* the three APKs, so VINS-Mono's native core is compiled too — and pushes the whole log to
# the `ci-diag` branch, because the job log and the artifact download both live on hosts this
# environment cannot reach. Read it back with:
#     git fetch origin ci-diag && git show origin/ci-diag:gradle.log
name: CI diagnostics
on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diag:
    name: Build everything and report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          fi
      - name: Toolchain and build
        run: |
          set +e
          S="${GITHUB_STEP_SUMMARY:-/tmp/step.md}"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p diag-out
          LOG=diag-out/gradle.log
          {
            echo "### Toolchain"
            echo '```text'
            java -version 2>&1 || true
            echo "SDK=$SDK"
            for d in platforms ndk ndk-bundle cmake build-tools; do
              echo "$d: $(ls "$SDK/$d" 2>/dev/null | tr '\n' ' ' || true)"
            done
            echo "cmake: $(command -v cmake || echo none) | $(cmake --version 2>&1 | head -1 || true)"
            echo "ninja: $(command -v ninja || echo none)"
            echo '```'
          } > diag-out/toolchain.md
          cat diag-out/toolchain.md >> "$S"
          ./gradlew test :app:assembleFullDebug :app:assembleLiteDebug :app:assembleBeDebug \
              --no-daemon --continue --console=plain --stacktrace --warning-mode=summary \
              > "$LOG" 2>&1
          echo "GRADLE_EXIT=$?" >> "$LOG"
          grep -E "^(e: |w: file)" "$LOG" | head -120 >> diag-out/errors.md
          grep -nE "[A-Za-z0-9_./-]+\.(kt|kts|java|cpp|h):[0-9]+:[0-9]+" "$LOG" | head -200 >> diag-out/errors.md
          awk '/\* What went wrong/{p=1} /\* Try:/{p=0} p' "$LOG" | head -260 >> diag-out/errors.md
          grep -nE "error:|fatal error|undefined reference|CMake Error|Could not (resolve|find|create|download|open)|FAILURE: Build|> Task .* FAILED" "$LOG" \
              | cut -c1-300 | head -240 >> diag-out/errors.md
          echo '### Tail' >> diag-out/errors.md
          tail -80 "$LOG" >> diag-out/errors.md
          head -c 60000 diag-out/errors.md >> "$S"
      - name: Post the report to the pull request
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          python3 -c '
          import json, os, urllib.request
          tok = os.environ["GH_TOKEN"]; repo = os.environ["GITHUB_REPOSITORY"]; num = os.environ.get("PR_NUMBER") or "8"
          def read(path, limit):
              try:
                  return open(path, encoding="utf-8", errors="replace").read()[:limit]
              except OSError:
                  return "(missing)"
          body = "\n".join(["<!-- ci-diag -->", "", read("diag-out/toolchain.md", 3000), "", "### Errors", "",
                            read("diag-out/errors.md", 42000), "", "<details><summary>start of the raw log</summary>", "",
                            "```", read("diag-out/gradle.log", 9000), "```", "", "</details>"])
          api = "https://api.github.com/repos/" + repo
          def req(method, path, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              r = urllib.request.Request(api + path, data=data, method=method, headers={
                  "authorization": "Bearer " + tok, "accept": "application/vnd.github+json",
                  "user-agent": "ci-diag", "content-type": "application/json"})
              try:
                  with urllib.request.urlopen(r, timeout=60) as f:
                      return json.loads(f.read().decode() or "{}")
              except Exception as e:
                  print("API " + method + " " + path + " -> " + str(e))
                  return []
          existing = None
          for c in req("GET", "/issues/" + num + "/comments?per_page=100"):
              if "<!-- ci-diag -->" in (c.get("body") or ""):
                  existing = c["id"]
          req("PATCH" if existing else "POST", "/issues/comments/%s" % existing if existing else "/issues/" + num + "/comments", {"body": body})
          print("posted %d chars" % len(body))'
      - name: Fail, so the run is marked red
        run: exit 1

# TEMPORARY — diagnostics only, delete before merge.
#
# The sandbox this branch is developed in has no JDK and no route to Maven Central or Google's maven,
# so nothing here can be compiled locally. This workflow builds what the real workflows build — the unit
# tests *and* the three APKs, so VINS-Mono's native core is compiled too — and reports the errors back
# through check-run annotations, readable with:
#     gh api repos/mt-VR/NextVR/check-runs/<check-run-id>/annotations --jq '.[].message'
# (the job log, the artifacts and the job summary all live on hosts this environment cannot reach, and
# each annotation is cut at 4096 characters — hence the chunks.)
name: CI diagnostics
on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: Build everything and report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          fi
      - name: Build
        run: |
          set +e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p diag-out
          LOG=diag-out/gradle.log
          {
            echo "TOOLCHAIN java: $(java -version 2>&1 | head -1)"
            echo "SDK=$SDK"
            for d in platforms ndk cmake build-tools; do
              echo "$d: $(ls "$SDK/$d" 2>/dev/null | tr '\n' ' ' || true)"
            done
          } > diag-out/toolchain.md
          # -Pvins.nativeOnly first: the native core is the part nobody has ever compiled here, and a
          # CMake failure would otherwise be buried under 400 lines of Gradle stack trace.
          ./gradlew :vins:assembleDebug --no-daemon --console=plain --stacktrace > diag-out/vins.log 2>&1
          echo "VINS_EXIT=$?" >> diag-out/vins.log
          ./gradlew test :app:assembleFullDebug :app:assembleLiteDebug :app:assembleBeDebug \
              --no-daemon --continue --console=plain --stacktrace --warning-mode=summary \
              > "$LOG" 2>&1
          echo "GRADLE_EXIT=$?" >> "$LOG"
          cat diag-out/vins.log >> "$LOG"
          P=/home/runner/work/NextVR/NextVR/
          {
            echo "### FAILING TASKS"
            grep -hE "^> Task .* FAILED" "$LOG" diag-out/vins.log | sort -u
            echo "### GRADLE EXIT"
            grep -hE "^(VINS|GRADLE)_EXIT" "$LOG" diag-out/vins.log
            echo "### KOTLIN/JAVA ERRORS (unique)"
            cat "$LOG" diag-out/vins.log | grep -hoE "e: file://[^ ]+\.kt:[0-9]+:[0-9]+ .*" | sed "s#file://$P##" | sort -u | head -70
            echo "### WHAT WENT WRONG"
            cat "$LOG" diag-out/vins.log | grep -hA5 "What went wrong" | grep -vE "^\s*at |^--$" | head -90
            echo "### NATIVE / CMAKE / DEPENDENCY ERRORS (unique)"
            cat "$LOG" diag-out/vins.log | grep -hE "error:|fatal error|undefined reference|CMake Error|CMake Warning|Could not (resolve|find|create|download|open)|No such file or directory" \
                | sed "s#$P##" | sort -u | head -70
            echo "### TAIL"
            tail -25 "$LOG" | cut -c1-200
          } > diag-out/errors.md
          wc -c diag-out/errors.md | cut -c1-40 >> diag-out/errors.md
      - name: Report
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          # An annotation is cut at 4096 characters, and every newline costs three of those, so the
          # chunks are kept small and on whole lines.
          enc() { sed -e 's/%/%25/g' -e 's/#/%23/g' | tr -d '\r' | awk '{printf "%s%s", (NR>1 ? "%0A" : ""), $0}'; }
          total=$(wc -c < diag-out/errors.md)
          echo "::error title=size::errors.md is $total bytes"
          split -C 1150 -a 2 -d diag-out/errors.md diag-out/ee
          n=0
          for f in diag-out/ee*; do
            n=$((n+1)); [ "$n" -gt 9 ] && break
            echo "::error title=e$n::$(enc < "$f")"
          done
          tail -n +1 diag-out/errors.md | tail -c 6000 > diag-out/tt
          split -C 1150 -a 2 -d diag-out/tt diag-out/ww
          m=0
          for f in diag-out/ww*; do
            m=$((m+1)); [ "$m" -gt 6 ] && break
            echo "::warning title=w$m::$(enc < "$f")"
          done
          echo "::notice title=toolchain::$(enc < diag-out/toolchain.md)"

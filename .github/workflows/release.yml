# Tests, build and release for PhoneXR.
#
# * push to main — the unit tests run, the APKs (full, lite, BE) and the SDK are built, and
#   everything is published into the single "latest" release: its files are overwritten, so the
#   links to them never change while the release itself always holds the freshest build (a
#   normal release, not a pre-release). The version is never bumped: it stays pinned at 2.0.1
#   in app/build.gradle.kts, and every build is told apart by its commit — the commit number
#   stands next to the version in the release title and inside the app itself
#   ("Version 2.0.1 (abc1234)", baked in at build time).
# * push of a v* tag — the same run, but a versioned release: PhoneXR-<version>.apk and so on.
# * pull request to main — the same tests and build, but nothing is published.
# * Manual run (Actions → Run workflow) — a versioned release when a tag is given,
#   otherwise just a fresh build into the latest release.
#
# Why the commit number instead of a moving version: the latest release is a rolling pointer,
# so its date is written once, when it is first published, and GitHub never moves it again —
# a merge changes the files, the title and the notes, but the Releases tab still shows the
# date of the very first build. The commit next to the pinned version is the signal: it is in
# the title, in the notes and in the run artifact name, and it moves on every merge.
name: Tests, build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, for example v2.0.1 (empty — the latest release)"
        required: false
        default: ""

permissions:
  contents: write

# Two pushes in a row to main must not build a release at the same time.
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          fi
      - name: Tests for app, sdk and OrangeHanding
        run: ./gradlew test --no-daemon --stacktrace
      - name: Reports, if the tests failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

  release:
    name: Build and release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          fi
      # No version bump: the version in app/build.gradle.kts stays pinned at 2.0.1 and the
      # builds are told apart by the commit they were built from, which the build bakes into
      # the APKs and which the release title carries next to the version.
      - name: Build the APKs (full, lite, BE) and the SDK
        run: ./gradlew :app:assembleFullDebug :app:assembleLiteDebug :app:assembleBeDebug :sdk:build --no-daemon --stacktrace
      - name: File names
        id: files
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          SHA=$(git rev-parse --short HEAD)
          # The commit the release and the latest tag must both point at.
          HEAD_SHA=$(git rev-parse HEAD)
          mkdir -p dist/latest dist/versioned sdk-zip/PhoneXR-SDK
          # Stable names: the links of the latest release stay the same from build to build.
          cp app/build/outputs/apk/full/debug/app-full-debug.apk dist/latest/PhoneXR-full.apk
          cp app/build/outputs/apk/lite/debug/app-lite-debug.apk dist/latest/PhoneXR-lite.apk
          cp app/build/outputs/apk/be/debug/app-be-debug.apk   dist/latest/PhoneXR-BE.apk
          # Versioned names: the site (index.html) and the permanent releases link to these.
          cp app/build/outputs/apk/full/debug/app-full-debug.apk "dist/versioned/PhoneXR-$VERSION.apk"
          cp app/build/outputs/apk/lite/debug/app-lite-debug.apk "dist/versioned/PhoneXR-$VERSION-lite.apk"
          cp app/build/outputs/apk/be/debug/app-be-debug.apk   "dist/versioned/PhoneXR-$VERSION-BE.apk"
          cp sdk/build/libs/sdk.jar sdk-zip/PhoneXR-SDK/PhoneXR-SDK.jar
          cp -R sdk/docs sdk/runtime sdk/tools sdk-zip/PhoneXR-SDK/
          (cd sdk-zip && zip -qr "../dist/latest/PhoneXR-SDK.zip" PhoneXR-SDK)
          cp dist/latest/PhoneXR-SDK.zip "dist/versioned/PhoneXR-SDK-$VERSION.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
      - name: APKs as run artifacts
        uses: actions/upload-artifact@v4
        with:
          # The version is pinned, so the commit is what tells the run artifacts apart.
          name: nextvr-${{ steps.files.outputs.version }}-${{ steps.files.outputs.sha }}
          path: dist/latest/*
          retention-days: 14
      - name: Publish the release
        # A pull request only checks the build: no releases are made from one.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.files.outputs.version }}"
          SHA="${{ steps.files.outputs.sha }}"
          BUILT="${{ steps.files.outputs.built }}"
          HEAD_SHA="${{ steps.files.outputs.head }}"
          TAG=""
          if [ -n "$TAG_INPUT" ]; then TAG="$TAG_INPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"
          fi
          if [ -n "$TAG" ]; then
            # A version: a v* tag or a manual run with a tag.
            gh release view "$TAG" >/dev/null 2>&1 \
              || gh release create "$TAG" --target "$GITHUB_SHA" --title "PhoneXR ${TAG#v} ($SHA)" --generate-notes
            gh release upload "$TAG" dist/versioned/* --clobber
            echo "Release $TAG: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            # Push to main: a single normal latest release. Its files are overwritten, so the
            # release is always fresh while the links to it stay constant; the latest tag is
            # moved onto the commit that was built. A pre-release becomes a normal one.
            # The version is pinned, so the date GitHub shows beside the release (the date it
            # was first published, never moved again) is paired with the commit number: it is
            # what says "newer" in the release list.
            TITLE="NextVR $VERSION ($SHA) — latest build"
            NOTES="Automatic build of \`${GITHUB_REF_NAME}\`: version **$VERSION**, commit \`$SHA\`, built $BUILT.

          This release rolls forward: every merge to \`main\` overwrites the files below, so the
          date GitHub shows beside the release is the date of the first build and does not
          change. The commit above is the authoritative record of what these APKs contain."
            if gh release view latest >/dev/null 2>&1; then
              gh release edit latest \
                --title "$TITLE" --notes "$NOTES"
              gh release upload latest dist/latest/* --clobber
            else
              gh release create latest --target "$HEAD_SHA" \
                --title "$TITLE" --notes "$NOTES" dist/latest/*
            fi
            # Exactly what was asked for: a normal release, not a pre-release. If it already
            # existed as a pre-release (or the flag got lost somewhere), clear it here.
            # The REST API only takes a release id for PATCH — repos/.../releases/tags/<tag>
            # exists for GET alone and answers 404 to a PATCH, so look the id up first.
            RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" --jq .id 2>/dev/null || true)
            if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
                -F prerelease=false -f make_latest=true >/dev/null
            elif gh release edit latest --prerelease=false --latest >/dev/null 2>&1; then
              # The id could not be looked up, but gh cleared the flag by tag all the same.
              echo "Cleared the pre-release flag of the latest release by tag."
            else
              echo "::error::the latest release was not found, publishing failed"
              exit 1
            fi
            # And the latest tag goes onto the commit that was built, so the release page shows this code.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$HEAD_SHA" -F force=true >/dev/null 2>&1 || true
            {
              echo "Published the latest release: **NextVR $VERSION**, commit $SHA, built $BUILT."
              echo "- https://github.com/$GITHUB_REPOSITORY/releases/tag/latest"
              echo "- Full: https://github.com/$GITHUB_REPOSITORY/releases/download/latest/PhoneXR-full.apk"
              echo "- Lite: https://github.com/$GITHUB_REPOSITORY/releases/download/latest/PhoneXR-lite.apk"
              echo "- BE: https://github.com/$GITHUB_REPOSITORY/releases/download/latest/PhoneXR-BE.apk"
              echo "- SDK: https://github.com/$GITHUB_REPOSITORY/releases/download/latest/PhoneXR-SDK.zip"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

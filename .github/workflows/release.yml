# Тесты, сборка и релиз PhoneXR.
#
# * push в main — юнит-тесты, сборка APK (full, lite, BE) и SDK, а затем релиз
#   «latest»: файлы в нём перезаписываются, значит ссылки на них не меняются,
#   а сам релиз всегда свежий (обычный, не предварительный).
# * push тега v* — тот же прогон, но релиз версии: PhoneXR-<версия>.apk и т. д.
# * pull request в main — те же тесты и сборка, но без публикации: видно до слияния.
# * Ручной запуск (Actions → Run workflow) — как релиз версии, если указать тег,
#   иначе просто свежая сборка в релиз latest.
name: Тесты, сборка и релиз

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег версии, например v2.0.2 (пусто — предрелиз latest)"
        required: false
        default: ""

permissions:
  contents: write

# Два push подряд в main не должны собирать релиз одновременно.
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Юнит-тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Лицензии Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          fi
      - name: Тесты app, sdk и OrangeHanding
        run: ./gradlew test --no-daemon --stacktrace
      - name: Отчёты, если тесты упали
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore

  release:
    name: Сборка и релиз
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Лицензии Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          fi
      - name: Сборка APK (full, lite, BE) и SDK
        run: ./gradlew :app:assembleFullDebug :app:assembleLiteDebug :app:assembleBeDebug :sdk:build --no-daemon --stacktrace
      - name: Имена файлов
        id: files
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          SHA=$(git rev-parse --short HEAD)
          mkdir -p dist/latest dist/versioned sdk-zip/PhoneXR-SDK
          # Стабильные имена: у предрелиза latest ссылки не меняются от сборки к сборке.
          cp app/build/outputs/apk/full/debug/app-full-debug.apk dist/latest/PhoneXR-full.apk
          cp app/build/outputs/apk/lite/debug/app-lite-debug.apk dist/latest/PhoneXR-lite.apk
          cp app/build/outputs/apk/be/debug/app-be-debug.apk   dist/latest/PhoneXR-BE.apk
          # Версионные имена: на них ссылается сайт (index.html) и постоянные релизы.
          cp app/build/outputs/apk/full/debug/app-full-debug.apk "dist/versioned/PhoneXR-$VERSION.apk"
          cp app/build/outputs/apk/lite/debug/app-lite-debug.apk "dist/versioned/PhoneXR-$VERSION-lite.apk"
          cp app/build/outputs/apk/be/debug/app-be-debug.apk   "dist/versioned/PhoneXR-$VERSION-BE.apk"
          cp sdk/build/libs/sdk.jar sdk-zip/PhoneXR-SDK/PhoneXR-SDK.jar
          cp -R sdk/docs sdk/runtime sdk/tools sdk-zip/PhoneXR-SDK/
          (cd sdk-zip && zip -qr "../dist/latest/PhoneXR-SDK.zip" PhoneXR-SDK)
          cp dist/latest/PhoneXR-SDK.zip "dist/versioned/PhoneXR-SDK-$VERSION.zip"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: APK в артефакты прогона
        uses: actions/upload-artifact@v4
        with:
          name: phonexr-apk
          path: dist/latest/*
          retention-days: 14
      - name: В релиз
        # В pull request сборка только проверяется: релизов из них не делаем.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.files.outputs.version }}"
          SHA="${{ steps.files.outputs.sha }}"
          TAG=""
          if [ -n "$TAG_INPUT" ]; then TAG="$TAG_INPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"
          fi
          if [ -n "$TAG" ]; then
            # Версия: тег v* или ручной запуск с тегом.
            gh release view "$TAG" >/dev/null 2>&1 \
              || gh release create "$TAG" --target "$GITHUB_SHA" --title "PhoneXR ${TAG#v}" --generate-notes
            gh release upload "$TAG" dist/versioned/* --clobber
            echo "Релиз $TAG: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            # Push в main: один обычный релиз latest. Файлы в нём перезаписываются, поэтому
            # релиз всегда свежий, а ссылки на него постоянные; тег latest переставляется
            # на собранный коммит. Из предварительного релиз становится обычным.
            NOTES="Автосборка из ${GITHUB_REF_NAME}: версия $VERSION, коммит $SHA."
            if gh release view latest >/dev/null 2>&1; then
              gh release edit latest \
                --title "PhoneXR main — последняя сборка" --notes "$NOTES"
              gh release upload latest dist/latest/* --clobber
            else
              gh release create latest --target "$GITHUB_SHA" \
                --title "PhoneXR main — последняя сборка" --notes "$NOTES" dist/latest/*
            fi
            # Ровно то, что просили: релиз обычный, а не предварительный. Если он уже
            # существовал предрелизом (или флаг где-то потерялся) — снимаем его здесь.
            # Обновлять релиз можно только по id: у /releases/tags/<тег> есть лишь GET.
            RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/latest" --jq '.id')
            if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
              echo "::error::релиз latest не найден, публикация не удалась"
              exit 1
            fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F prerelease=false >/dev/null
            # И тег latest — на собранный коммит, чтобы страница релиза показывала этот код.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1 || true
            {
              echo "Опубликован релиз latest (версия $VERSION, коммит $SHA):"
              echo "- https://github.com/$GITHUB_REPOSITORY/releases/tag/latest"
              echo "- Full: https://github.com/$GITHUB_REPOSITORY/releases/download/latest/PhoneXR-full.apk"
              echo "- Lite: https://github.com/$GITHUB_REPOSITORY/releases/download/latest/PhoneXR-lite.apk"
              echo "- BE: https://github.com/$GITHUB_REPOSITORY/releases/download/latest/PhoneXR-BE.apk"
              echo "- SDK: https://github.com/$GITHUB_REPOSITORY/releases/download/latest/PhoneXR-SDK.zip"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
